[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "camblas"
version = "0.1.0.dev0"
description = "CAMBLAS PyTorch backend and optional SGLang integration"
requires-python = ">=3.11"
dependencies = ["torch>=2.8"]

[project.entry-points."sglang.srt.plugins"]
camblas = "camblas_sglang:install"

[project.entry-points."torch.backends"]
camblas = "_camblas_backend:_autoload"

[tool.setuptools]
packages = ["_camblas"]
py-modules = ["_camblas_backend", "camblas_sglang"]

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["bench/*.py", "scripts/*.py", "tests/*.py", "_camblas/*.py", "camblas_sglang.py", "_camblas_backend.py"]
extend-exclude = ["bench/results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
